name: Karta pobytu status monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '55 13 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: read

concurrency:
  group: karta-pobytu-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Przybysz is geographically restricted to European access. GitHub-hosted
    # runners do not provide a guaranteed European egress location, so hosted
    # runs may require a trusted EU proxy. Advanced users can set the repository
    # variable PIO_RUNNER to the label of a self-hosted runner located in Europe.
    runs-on: ${{ vars.PIO_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore previous private fingerprint
        uses: actions/cache/restore@v5
        with:
          path: .pio-state
          key: pio-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            pio-state-${{ github.repository_id }}-

      - name: Check Przybysz
        env:
          PIO_LOGIN: ${{ secrets.PIO_LOGIN }}
          PIO_PASSWORD: ${{ secrets.PIO_PASSWORD }}
          PIO_NUMBER: ${{ secrets.PIO_NUMBER }}
          PIO_PROXY_SERVER: ${{ secrets.PIO_PROXY_SERVER }}
          PIO_PROXY_USERNAME: ${{ secrets.PIO_PROXY_USERNAME }}
          PIO_PROXY_PASSWORD: ${{ secrets.PIO_PROXY_PASSWORD }}
        run: npm run check

      - name: Read result
        id: result
        shell: bash
        run: echo "outcome=$(jq -r .outcome .pio-state/result.json)" >> "$GITHUB_OUTPUT"

      - name: Save current private fingerprint
        uses: actions/cache/save@v5
        with:
          path: .pio-state
          key: pio-state-${{ github.repository_id }}-${{ github.run_id }}

      - name: Status changed
        if: steps.result.outputs.outcome == 'changed'
        shell: bash
        run: |
          echo '## 🔔 Karta pobytu status changed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Log in to Przybysz to see the new status. The monitor intentionally does not expose your case details in GitHub logs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A change was detected. Failing this run intentionally so GitHub can surface a failed-workflow notification.'
          exit 1

      - name: First-run note
        if: steps.result.outputs.outcome == 'baseline'
        run: |
          echo '## ✅ Baseline saved' >> "$GITHUB_STEP_SUMMARY"
          echo 'The next runs will notify you if the monitored case changes.' >> "$GITHUB_STEP_SUMMARY"
