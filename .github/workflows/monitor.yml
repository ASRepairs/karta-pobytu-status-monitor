name: Karta pobytu status monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '55 13 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: read

concurrency:
  group: karta-pobytu-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Linux is used because it lets the workflow create an automatic European
    # egress path without asking every fork owner to configure a VPN account.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install automatic egress tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tor openvpn

      - name: Prepare European egress
        id: egress
        shell: bash
        env:
          # Optional override for users who already have a trusted proxy. No
          # extra networking secret is required for the default automatic mode.
          PIO_PROXY_SERVER: ${{ secrets.PIO_PROXY_SERVER }}
          PIO_PROXY_USERNAME: ${{ secrets.PIO_PROXY_USERNAME }}
          PIO_PROXY_PASSWORD: ${{ secrets.PIO_PROXY_PASSWORD }}
        run: bash scripts/prepare-eu-egress.sh

      - name: Restore previous private fingerprint
        uses: actions/cache/restore@v5
        with:
          path: .pio-state
          key: pio-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            pio-state-${{ github.repository_id }}-

      - name: Check Przybysz
        env:
          PIO_LOGIN: ${{ secrets.PIO_LOGIN }}
          PIO_PASSWORD: ${{ secrets.PIO_PASSWORD }}
          PIO_NUMBER: ${{ secrets.PIO_NUMBER }}
          # A configured private proxy has priority. Otherwise this is populated
          # only when the zero-config Tor fallback was selected. VPN Gate works
          # at the routing layer and therefore leaves this blank.
          PIO_PROXY_SERVER: ${{ secrets.PIO_PROXY_SERVER || steps.egress.outputs.proxy }}
          PIO_PROXY_USERNAME: ${{ secrets.PIO_PROXY_USERNAME }}
          PIO_PROXY_PASSWORD: ${{ secrets.PIO_PROXY_PASSWORD }}
        run: npm run check

      - name: Read result
        id: result
        shell: bash
        run: echo "outcome=$(jq -r .outcome .pio-state/result.json)" >> "$GITHUB_OUTPUT"

      - name: Save current private fingerprint
        uses: actions/cache/save@v5
        with:
          path: .pio-state
          key: pio-state-${{ github.repository_id }}-${{ github.run_id }}

      - name: Status changed
        if: steps.result.outputs.outcome == 'changed'
        shell: bash
        run: |
          echo '## 🔔 Karta pobytu status changed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Log in to Przybysz to see the new status. The monitor intentionally does not expose your case details in GitHub logs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A change was detected. Failing this run intentionally so GitHub can surface a failed-workflow notification.'
          exit 1

      - name: First-run note
        if: steps.result.outputs.outcome == 'baseline'
        run: |
          echo '## ✅ Baseline saved' >> "$GITHUB_STEP_SUMMARY"
          echo 'The next runs will notify you if the monitored case changes.' >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up egress helpers
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/kpsm-tor/tor.pid ]]; then
            kill "$(cat /tmp/kpsm-tor/tor.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/kpsm-vpngate/openvpn.pid ]]; then
            sudo kill "$(cat /tmp/kpsm-vpngate/openvpn.pid)" 2>/dev/null || true
          fi
