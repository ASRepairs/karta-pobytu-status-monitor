name: Karta pobytu status monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '55 13 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: read

concurrency:
  group: karta-pobytu-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Linux is used because it lets the workflow create an automatic European
    # egress path without asking every fork owner to configure a VPN account.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Playwright headless Chromium
        # Do not use --with-deps here. GitHub's Ubuntu 24.04 image already has
        # the browser runtime libraries, while --with-deps runs apt-get and can
        # stall on a transient Ubuntu/Azure mirror. This monitor is headless, so
        # only Playwright's matching Chromium headless shell is required.
        timeout-minutes: 5
        run: npx playwright install --only-shell chromium

      - name: Install automatic egress tools
        id: egress_tools
        shell: bash
        timeout-minutes: 5
        run: |
          set +e

          if command -v tor >/dev/null 2>&1 && command -v openvpn >/dev/null 2>&1; then
            echo 'Tor and OpenVPN are already available.'
            echo 'available=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'Installing Tor and OpenVPN with bounded apt timeouts…'

          # Hosted runners normally point at an Azure Ubuntu mirror. If that
          # mirror is unhealthy, prefer Ubuntu's public archive instead of
          # letting apt retry the Azure endpoint for most of the job lifetime.
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          sudo timeout 120s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            update
          update_rc=$?

          sudo timeout 120s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            install -y --no-install-recommends tor openvpn
          install_rc=$?

          if command -v tor >/dev/null 2>&1 && command -v openvpn >/dev/null 2>&1; then
            echo 'Automatic egress tools installed.'
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo "Could not install automatic egress tools in the bounded setup window (apt update rc=${update_rc}, install rc=${install_rc})."
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '### ⏭️ Status check skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'The runner package mirror did not provide Tor/OpenVPN in time. No case-status conclusion was made and this infrastructure problem is intentionally not treated as a status-change alert.' >> "$GITHUB_STEP_SUMMARY"
          fi

          # Package-mirror trouble is an infrastructure condition, not evidence
          # about the residence case, so this setup step itself stays green.
          exit 0

      - name: Prepare European egress
        if: steps.egress_tools.outputs.available == 'true'
        id: egress
        shell: bash
        env:
          # Optional override for users who already have a trusted proxy. No
          # extra networking secret is required for the default automatic mode.
          PIO_PROXY_SERVER: ${{ secrets.PIO_PROXY_SERVER }}
          PIO_PROXY_USERNAME: ${{ secrets.PIO_PROXY_USERNAME }}
          PIO_PROXY_PASSWORD: ${{ secrets.PIO_PROXY_PASSWORD }}
        run: bash scripts/prepare-eu-egress.sh

      - name: No European route available
        if: steps.egress_tools.outputs.available != 'true' || steps.egress.outputs.available != 'true'
        shell: bash
        run: |
          echo 'The portal check was skipped because the runner could not prepare a usable European route.'
          echo 'This is intentionally a successful workflow run: runner/package/relay availability is not evidence of a residence-case status change.'

      - name: Restore previous private fingerprint
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .pio-state
          key: pio-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            pio-state-${{ github.repository_id }}-

      - name: Check Przybysz
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true'
        env:
          PIO_LOGIN: ${{ secrets.PIO_LOGIN }}
          PIO_PASSWORD: ${{ secrets.PIO_PASSWORD }}
          PIO_NUMBER: ${{ secrets.PIO_NUMBER }}
          # Optional one-time verification. If set, the workflow compares the
          # extracted explicit status value against this secret without printing
          # either value. Remove the secret after validation.
          PIO_EXPECTED_STATUS: ${{ secrets.PIO_EXPECTED_STATUS }}
          # Use the configured private proxy only if the egress preflight proved
          # that exact proxy works. Otherwise use the automatically selected Tor
          # proxy; VPN Gate and direct modes operate at the routing layer.
          PIO_PROXY_SERVER: ${{ steps.egress.outputs.mode == 'custom-proxy' && secrets.PIO_PROXY_SERVER || steps.egress.outputs.proxy }}
          PIO_PROXY_USERNAME: ${{ steps.egress.outputs.mode == 'custom-proxy' && secrets.PIO_PROXY_USERNAME || '' }}
          PIO_PROXY_PASSWORD: ${{ steps.egress.outputs.mode == 'custom-proxy' && secrets.PIO_PROXY_PASSWORD || '' }}
        run: npm run check

      - name: Read result
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true'
        id: result
        shell: bash
        run: |
          echo "outcome=$(jq -r .outcome .pio-state/result.json)" >> "$GITHUB_OUTPUT"
          echo "status_field_found=$(jq -r .status_field_found .pio-state/result.json)" >> "$GITHUB_OUTPUT"
          echo "expected_status_checked=$(jq -r .expected_status_checked .pio-state/result.json)" >> "$GITHUB_OUTPUT"
          echo "expected_status_match=$(jq -r .expected_status_match .pio-state/result.json)" >> "$GITHUB_OUTPUT"

      - name: Save current private fingerprint
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true'
        uses: actions/cache/save@v5
        with:
          path: .pio-state
          key: pio-state-${{ github.repository_id }}-${{ github.run_id }}

      - name: Status changed
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true' && steps.result.outputs.outcome == 'changed'
        shell: bash
        run: |
          echo '## 🔔 Karta pobytu status changed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The monitor verified the explicit case status field and detected a change in that status value.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Log in to Przybysz to read the new status. The readable value is intentionally not exposed in this public repository.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A verified status change was detected. Failing this run intentionally so GitHub can surface a failed-workflow notification.'
          exit 1

      - name: First-run note
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true' && steps.result.outputs.outcome == 'baseline'
        run: |
          echo '## ✅ Strict status baseline saved' >> "$GITHUB_STEP_SUMMARY"
          echo 'The case, PIO number, and explicit status/stage field were all identified. Future runs compare only that explicit status value.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verification note
        if: steps.egress_tools.outputs.available == 'true' && steps.egress.outputs.available == 'true' && steps.result.outputs.expected_status_checked == 'true' && steps.result.outputs.expected_status_match == 'true'
        run: |
          echo '## ✅ Status extraction independently verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'The extracted explicit status matched the temporary PIO_EXPECTED_STATUS secret. Neither value was printed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up egress helpers
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/kpsm-tor/tor.pid ]]; then
            kill "$(cat /tmp/kpsm-tor/tor.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/kpsm-vpngate/openvpn.pid ]]; then
            sudo kill "$(cat /tmp/kpsm-vpngate/openvpn.pid)" 2>/dev/null || true
          fi
